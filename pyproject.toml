[project]
name = "borek-ai-suite"
version = "0.1.0"
description = "Framework and Presentation Generation Pipeline for Borek AI Suite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-docx>=1.1.0",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.0",
    "anthropic>=0.40.0",
    "openai>=1.68.0",
    "reportlab>=4.2.5",
    "pypdf>=5.0.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "PyJWT>=2.9.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23.0",
    "pytest>=8.3.0",
    "pypdf>=5.0.0",
    "pydantic>=2.0",
    "datamodel-code-generator>=0.26.0",
    "python-dotenv>=1.0.0",
]
integration = [
    "psycopg[binary]>=3.2.0",
]
api = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "apps/api", "apps/services/api"]
addopts = "-m 'not live_claude'"
markers = [
    "integration: tests requiring external services such as Redis",
    "live_claude: calls Anthropic Claude live; requires ANTHROPIC_API_KEY (skipped in CI by default)",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/services/api"]
include = ["app*"]
