version: "1.0"
default: deny

# BT-32: the classification scheme is an approved working default (O4, 3 Sep 2026).
# Production field map signed 2026-09-11 by O4 owner / Head of AI.
# Evidence: docs/tickets/BT32_O4_SIGNOFF.md
approval:
  status: approved
  signed_off: true
  scheme: working_default

classifications:
  - public
  - internal
  - client_confidential
  - restricted

# Only these providers may receive any outbound field.
approved_providers:
  - openai
  - anthropic
  - gamma

rules:
  public:
    external_provider: allow
  internal:
    external_provider: allow_if_provider_approved
  client_confidential:
    external_provider: allow_if_provider_and_field_approved
  restricted:
    external_provider: deny

# Production field map signed by O4 owner / Head of AI on 2026-09-11.
# A path applies to itself and every descendant unless a longer path overrides it.
# Restricted has no entries: nothing classified restricted may leave.
field_classifications:
  "/instructions": internal
  "/targetSchema": internal
  "/layoutId": internal
  "/chapterLayoutGuidance": internal
  "/violations": internal
  "/system": internal
  "/frameworkObject": client_confidential
  "/chapters": client_confidential
  "/offendingValues": client_confidential
  "/user": client_confidential
  # JJ-26 named Borek template slots. Everything fed by a Framework chapter is
  # client_confidential; only the opportunity title is internal.
  "/slots/cover.title": internal
  "/slots/cover.client_name": client_confidential
  "/slots/cover.subtitle": client_confidential
  "/slots/executive_summary.body": client_confidential
  "/slots/context.summary": client_confidential
  "/slots/problem_solution.body": client_confidential
  "/slots/process_flow.body": client_confidential
  "/slots/scope.in_scope": client_confidential
  "/slots/requirements.body": client_confidential
  "/slots/architecture.body": client_confidential
  "/slots/compliance.body": client_confidential
  "/slots/timeline.body": client_confidential
  "/slots/milestones.body": client_confidential
  "/slots/team.body": client_confidential
  "/slots/success_metrics.body": client_confidential
  "/slots/open_questions.body": client_confidential
  "/slots/next_steps.body": client_confidential
  # Client logo HTTPS URL on the live Gamma request (not a named slots[] entry).
  "/client_logo_url": client_confidential
  # Live Gamma technical/provider metadata. Not customer content.
  "/provider/themeId": internal
  "/provider/gammaId": internal
  "/provider/textMode": internal
  "/provider/format": internal
  "/provider/exportAs": internal
  "/provider/cardSplit": internal
  "/provider/numCards": internal
  # Raw prior-stage / grounded-fact objects must never leave. Unlisted = deny.

# Client-confidential leaves require an exact or prefix allow-list entry per provider.
# These are the structured fields current live pipelines already send after PII redaction.
client_confidential_allowlist:
  openai:
    - "/frameworkObject"
    - "/chapters"
    - "/offendingValues"
  anthropic:
    - "/user"
  gamma:
    - "/slots/cover.client_name"
    - "/slots/cover.subtitle"
    - "/slots/executive_summary.body"
    - "/slots/context.summary"
    - "/slots/problem_solution.body"
    - "/slots/process_flow.body"
    - "/slots/scope.in_scope"
    - "/slots/requirements.body"
    - "/slots/architecture.body"
    - "/slots/compliance.body"
    - "/slots/timeline.body"
    - "/slots/milestones.body"
    - "/slots/team.body"
    - "/slots/success_metrics.body"
    - "/slots/open_questions.body"
    - "/slots/next_steps.body"
    - "/client_logo_url"

requirements:
  unclassified_fields: deny
  restricted_fields: deny
  log_payload_values: false
  audit_allowed_and_blocked_paths: true
